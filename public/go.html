<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    const p = new URLSearchParams(location.search)
    const room = p.get('room')
    const token = p.get('token')
    if (room) localStorage.setItem('pending-room', room)
    if (token) localStorage.setItem('intent-token', token)
    location.replace('/')
  </script>
</head>
</html>
